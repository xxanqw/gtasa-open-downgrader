name: Build Go releases
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  patches:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go run ./cmd/patch-assets
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: validated-patches
          path: internal/assets/Patches
          retention-days: 1
  linux:
    needs: patches
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y gcc pkg-config libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev liblzma5
      - run: go test -race ./... && go vet ./...
      - uses: actions/download-artifact@v8.0.1
        with:
          name: validated-patches
          path: internal/assets/Patches
      - name: Build online and offline
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then export VERSION="$GITHUB_REF_NAME"; fi
          ./scripts/build.sh online
          ./scripts/build.sh offline
      - name: Package AppImages
        run: |
          curl --fail -L -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo 'ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool' | sha256sum -c -
          curl --fail -L -o runtime-x86_64 https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          echo '2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  runtime-x86_64' | sha256sum -c -
          chmod +x appimagetool
          export APPIMAGETOOL="$PWD/appimagetool" APPIMAGE_RUNTIME="$PWD/runtime-x86_64"
          ./scripts/appimage.sh online
          ./scripts/appimage.sh offline
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: linux-releases
          path: |
            dist/gtasa-open-downgrader-linux
            dist/gtasa-open-downgrader-linux-offline
            dist/*.AppImage
  windows:
    needs: patches
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: mingw-w64-x86_64-gcc
      - name: Test
        shell: msys2 {0}
        run: |
          export CGO_ENABLED=1 CC=gcc
          go test ./...
          go vet ./...
      - uses: actions/download-artifact@v8.0.1
        with:
          name: validated-patches
          path: internal/assets/Patches
      - name: Build online and offline
        shell: msys2 {0}
        run: |
          export CGO_ENABLED=1 CC=gcc WINDRES=windres
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then export VERSION="$GITHUB_REF_NAME"; fi
          ./scripts/build.sh online
          ./scripts/build.sh offline
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-releases
          path: dist/*.exe
  release:
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: '*-releases'
          merge-multiple: true
          path: dist
      - name: Checksums
        run: cd dist && sha256sum gtasa-open-downgrader-* > SHA256SUMS
      - uses: softprops/action-gh-release@v3.0.2
        with:
          files: |
            dist/gtasa-open-downgrader-*
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
