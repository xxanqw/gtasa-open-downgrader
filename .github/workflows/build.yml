name: Build OneFile Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.6"

      - name: Install Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          
      - name: Install dependencies and build
        run: |
          sudo apt-get update
          sudo apt-get install -y tk
          uv sync --frozen --project downgrader --python "$pythonLocation" --group build
          cd downgrader
          uv run python -c "import patch_manager; patch_manager.download_and_extract_patches('https://www.icloud.com/iclouddrive/0afGK6zDBog_0drwp6YZoDLIg#Patches', 'Patches')"
          
          uv run pyinstaller --onefile --windowed \
            --splash "assets/splash.png" \
            --add-data "bin/xdelta3_linux:bin" \
            --add-data "bin/LICENSE.txt:bin" \
            --add-data "assets:assets" \
            --name "gtasa-open-downgrader-linux" \
            main.py
            
          uv run pyinstaller --onefile --windowed \
            --splash "assets/splash.png" \
            --add-data "bin/xdelta3_linux:bin" \
            --add-data "bin/LICENSE.txt:bin" \
            --add-data "assets:assets" \
            --add-data "Patches:Patches" \
            --name "gtasa-open-downgrader-linux-offline" \
            main.py
          cd ..

      - name: Package AppImages
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1
          wget -q https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool-x86_64.AppImage" | sha256sum -c -
          wget -q https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          echo "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  runtime-x86_64" | sha256sum -c -
          chmod +x appimagetool-x86_64.AppImage
          
          prepare_appdir() {
            local binary_name=$1
            local output_name=$2
            local appdir="AppDir_$binary_name"
            mkdir -p $appdir/usr/bin
            mkdir -p $appdir/usr/share/applications
            cp downgrader/dist/$binary_name $appdir/usr/bin/
            
            export QT_QPA_PLATFORM=offscreen
            uv run --project downgrader python -c "from PySide6.QtGui import QIcon; from PySide6.QtWidgets import QApplication; import sys; app=QApplication(sys.argv); icon=QIcon('downgrader/assets/icon.ico'); pixmap=icon.pixmap(256,256); pixmap.save('$appdir/$output_name.png')"
            
            echo "[Desktop Entry]" > $appdir/$output_name.desktop
            echo "Name=GTA SA Open Downgrader" >> $appdir/$output_name.desktop
            echo "Exec=$binary_name" >> $appdir/$output_name.desktop
            echo "Icon=$output_name" >> $appdir/$output_name.desktop
            echo "Type=Application" >> $appdir/$output_name.desktop
            echo "Categories=Game;" >> $appdir/$output_name.desktop
            cp $appdir/$output_name.desktop $appdir/usr/share/applications/
            
            echo "#!/bin/bash" > $appdir/AppRun
            echo 'HERE="$(dirname "$(readlink -f "${0}")")"' >> $appdir/AppRun
            echo 'export PATH="$HERE/usr/bin:$PATH"' >> $appdir/AppRun
            echo "exec \"$binary_name\" \"\$@\"" >> $appdir/AppRun
            chmod +x $appdir/AppRun
            ln -s $output_name.png $appdir/.DirIcon
            
            APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 ./appimagetool-x86_64.AppImage \
              --runtime-file runtime-x86_64 "$appdir" "$output_name.AppImage"
          }

          prepare_appdir "gtasa-open-downgrader-linux" "gtasa-open-downgrader-linux"
          prepare_appdir "gtasa-open-downgrader-linux-offline" "gtasa-open-downgrader-linux-offline"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gta-sa-downgrader-linux-appimages
          path: |
            gtasa-open-downgrader-linux.AppImage
            gtasa-open-downgrader-linux-offline.AppImage

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.6"

      - name: Install Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies and build
        shell: powershell
        run: |
          uv sync --frozen --project downgrader --python "$env:pythonLocation" --group build
          cd downgrader
          uv run python -c "import patch_manager; patch_manager.download_and_extract_patches('https://www.icloud.com/iclouddrive/0afGK6zDBog_0drwp6YZoDLIg#Patches', 'Patches')"
          
          uv run pyinstaller --onefile --windowed `
            --splash "assets/splash.png" `
            --add-data "bin/xdelta3.exe;bin" `
            --add-data "bin/LICENSE.txt;bin" `
            --add-data "assets;assets" `
            --icon "assets/icon.ico" `
            --name "gtasa-open-downgrader-windows" `
            main.py
            
          uv run pyinstaller --onefile --windowed `
            --splash "assets/splash.png" `
            --add-data "bin/xdelta3.exe;bin" `
            --add-data "bin/LICENSE.txt;bin" `
            --add-data "assets;assets" `
            --add-data "Patches;Patches" `
            --icon "assets/icon.ico" `
            --name "gtasa-open-downgrader-windows-offline" `
            main.py
          cd ..

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gtasa-open-downgrader-windows-builds
          path: downgrader/dist/*.exe

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts

      - name: Move artifacts to current directory
        run: |
          find artifacts -type f \( -name "*.AppImage" -o -name "*.exe" \) -exec mv -v -t . {} +

      - name: Create Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          files: |
            gtasa-open-downgrader-linux.AppImage
            gtasa-open-downgrader-linux-offline.AppImage
            gtasa-open-downgrader-windows.exe
            gtasa-open-downgrader-windows-offline.exe
          body: |
            GTA SA Open Downgrader v0.2.2

            ## Bug fixes
            - Fixed the application aborting with `QThread: Destroyed while thread is still running` when closing during background work
            - Added cooperative cancellation and graceful waiting for scans, downloads, mod checks, mod installations, and patching
            - Kept download and mod-install dialogs alive until their native worker threads have fully stopped
            - Preserved tracking data for mods installed before a cancellation
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
