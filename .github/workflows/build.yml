name: Build OneFile Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v7
          
      - name: Install dependencies and build
        run: |
          uv sync --project downgrader --group build
          cd downgrader
          uv run python -c "import patch_manager; patch_manager.download_and_extract_patches('https://www.icloud.com/iclouddrive/0afGK6zDBog_0drwp6YZoDLIg#Patches', 'Patches')"
          
          uv run pyinstaller --onefile --windowed \
            --add-data "bin/xdelta3_linux:bin" \
            --add-data "bin/LICENSE.txt:bin" \
            --add-data "assets:assets" \
            --name "gtasa-open-downgrader-linux" \
            main.py
            
          uv run pyinstaller --onefile --windowed \
            --add-data "bin/xdelta3_linux:bin" \
            --add-data "bin/LICENSE.txt:bin" \
            --add-data "assets:assets" \
            --add-data "Patches:Patches" \
            --name "gtasa-open-downgrader-linux-offline" \
            main.py
          cd ..

      - name: Package AppImages
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 libegl1 libgl1
          wget https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          
          prepare_appdir() {
            local binary_name=$1
            local output_name=$2
            local appdir="AppDir_$binary_name"
            mkdir -p $appdir/usr/bin
            mkdir -p $appdir/usr/share/applications
            cp downgrader/dist/$binary_name $appdir/usr/bin/
            
            export QT_QPA_PLATFORM=offscreen
            uv run --project downgrader python -c "from PySide6.QtGui import QIcon; from PySide6.QtWidgets import QApplication; import sys; app=QApplication(sys.argv); icon=QIcon('downgrader/assets/icon.ico'); pixmap=icon.pixmap(256,256); pixmap.save('$appdir/$output_name.png')"
            
            echo "[Desktop Entry]" > $appdir/$output_name.desktop
            echo "Name=GTA SA Open Downgrader" >> $appdir/$output_name.desktop
            echo "Exec=$binary_name" >> $appdir/$output_name.desktop
            echo "Icon=$output_name" >> $appdir/$output_name.desktop
            echo "Type=Application" >> $appdir/$output_name.desktop
            echo "Categories=Game;" >> $appdir/$output_name.desktop
            cp $appdir/$output_name.desktop $appdir/usr/share/applications/
            
            echo "#!/bin/bash" > $appdir/AppRun
            echo 'HERE="$(dirname "$(readlink -f "${0}")")"' >> $appdir/AppRun
            echo 'export PATH="$HERE/usr/bin:$PATH"' >> $appdir/AppRun
            echo "exec \"$binary_name\" \"\$@\"" >> $appdir/AppRun
            chmod +x $appdir/AppRun
            ln -s $output_name.png $appdir/.DirIcon
            
            ARCH=x86_64 ./appimagetool-x86_64.AppImage $appdir $output_name.AppImage
          }

          prepare_appdir "gtasa-open-downgrader-linux" "gtasa-open-downgrader-linux"
          prepare_appdir "gtasa-open-downgrader-linux-offline" "gtasa-open-downgrader-linux-offline"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gta-sa-downgrader-linux-appimages
          path: "*.AppImage"

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies and build
        shell: powershell
        run: |
          uv sync --project downgrader --group build
          cd downgrader
          uv run python -c "import patch_manager; patch_manager.download_and_extract_patches('https://www.icloud.com/iclouddrive/0afGK6zDBog_0drwp6YZoDLIg#Patches', 'Patches')"
          
          uv run pyinstaller --onefile --windowed `
            --add-data "bin/xdelta3.exe;bin" `
            --add-data "bin/LICENSE.txt;bin" `
            --add-data "assets;assets" `
            --icon "assets/icon.ico" `
            --name "gtasa-open-downgrader-windows" `
            main.py
            
          uv run pyinstaller --onefile --windowed `
            --add-data "bin/xdelta3.exe;bin" `
            --add-data "bin/LICENSE.txt;bin" `
            --add-data "assets;assets" `
            --add-data "Patches;Patches" `
            --icon "assets/icon.ico" `
            --name "gtasa-open-downgrader-windows-offline" `
            main.py
          cd ..

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gtasa-open-downgrader-windows-builds
          path: downgrader/dist/*.exe

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Move artifacts to current directory
        run: |
          find artifacts -type f \( -name "*.AppImage" -o -name "*.exe" \) -exec mv -v -t . {} +

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.AppImage
            *.exe
          body: |
            GTA SA Open Downgrader v0.2.0

            ## Mod management
            - Added persistent installed-mod versions, package fingerprints, source URLs, and installation timestamps
            - Added background update checks with installed, up-to-date, unknown, and update-available states in the UI
            - Added **Force Reinstall Selected Mods** for updates, missing files, and configuration recovery
            - Added legacy `.downgrader` detection with a configuration-backup warning
            - Legacy trackers now fully reinstall every recorded mod once, then migrate to the versioned tracker format

            ## Downloads and packaging
            - Replaced private fileserver downloads with official upstream mod packages
            - Added package-layout normalization, including GTA SA-only extraction from multi-game archives
            - Added ZIP and 7z path validation to prevent unsafe archive extraction
            - Switched iCloud patch downloads to the published `icloud-resolver` package
            - Patch downloads are now validated and replace existing patch assets only after successful extraction
            - Simplified Linux and Windows builds around `uv sync` and reproducible project dependencies

            ## Fixes and maintenance
            - Fixed gta_sa.exe consistency across different versions
            - Fixed the misspelled `generate_pathces.sh` filename and README reference
            - Fixed update checks so older releases are not offered as updates
            - Improved download error reporting, stability, and mod-installation progress handling
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
