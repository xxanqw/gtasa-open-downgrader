name: One-time Actions artifact cleanup (2026-11-12)

'on':
  push:
    branches: [maintenance/actions-storage-20261112]
    paths: [.github/workflows/actions-storage-cleanup-20261112.yml]

permissions:
  contents: read
  actions: write

concurrency:
  group: one-time-actions-storage-20261112
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify published releases and remove exact disposable artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import urllib.error
          import urllib.request

          REPO = "xxanqw/gtasa-open-downgrader"
          BRANCH = "refs/heads/maintenance/actions-storage-20261112"
          MANIFEST = [{'run': 43162019586, 'head_sha': 'b220622585856c40af9f8b7dd7ee04fc3e6a489f', 'tag': 'v0.3.0-rc.3', 'release': {'id': 442525218, 'assets': [{'id': 738254851, 'name': 'gtasa-open-downgrader-linux-offline.AppImage', 'size': 905771512}, {'id': 738254849, 'name': 'gtasa-open-downgrader-linux.AppImage', 'size': 26905080}, {'id': 738254852, 'name': 'gtasa-open-downgrader-windows-offline.exe', 'size': 918901248}, {'id': 738254854, 'name': 'gtasa-open-downgrader-windows.exe', 'size': 30955008}, {'id': 738254850, 'name': 'SHA256SUMS', 'size': 512}, {'id': 738254853, 'name': 'THIRD-PARTY-NOTICES.zip', 'size': 94352}]}, 'artifacts': [{'id': 13919366092, 'name': 'downgrader-windows', 'bytes': 949951100}, {'id': 13918962207, 'name': 'downgrader-linux', 'bytes': 932771448}, {'id': 13917664694, 'name': 'validated-patches', 'bytes': 887938884}]}, {'run': 43162019406, 'head_sha': 'b220622585856c40af9f8b7dd7ee04fc3e6a489f', 'tag': 'launcher-4', 'release': {'id': 442525229, 'assets': [{'id': 738248860, 'name': 'gta-sa.exe', 'size': 28282368}, {'id': 738248859, 'name': 'SHA256SUMS', 'size': 167}, {'id': 738248867, 'name': 'THIRD-PARTY-NOTICES.zip', 'size': 94352}]}, 'artifacts': [{'id': 13918962338, 'name': 'steam-launcher', 'bytes': 13609874}]}, {'run': 35452836248, 'head_sha': '9a539d2e81228840d5f8b9bbf3d2ac91e1c3f8c0', 'tag': 'v0.2.3', 'release': {'id': 392124823, 'assets': [{'id': 575031819, 'name': 'gtasa-open-downgrader-linux-offline.AppImage', 'size': 970336760}, {'id': 575031821, 'name': 'gtasa-open-downgrader-linux.AppImage', 'size': 90802680}, {'id': 575031822, 'name': 'gtasa-open-downgrader-windows-offline.exe', 'size': 936650943}, {'id': 575031818, 'name': 'gtasa-open-downgrader-windows.exe', 'size': 57103610}]}, 'artifacts': [{'id': 10587426418, 'name': 'gtasa-open-downgrader-windows-builds', 'bytes': 992836716}, {'id': 10586758834, 'name': 'gta-sa-downgrader-linux-appimages', 'bytes': 1060238368}]}, {'run': 33178327213, 'head_sha': 'cee6363c5d6e7884e1fce4a36e0aeb107f53eeae', 'tag': 'v0.2.2', 'release': {'id': 378528913, 'assets': [{'id': 533889789, 'name': 'gtasa-open-downgrader-linux-offline.AppImage', 'size': 970340856}, {'id': 533889793, 'name': 'gtasa-open-downgrader-linux.AppImage', 'size': 90802680}, {'id': 533889792, 'name': 'gtasa-open-downgrader-windows-offline.exe', 'size': 936653658}, {'id': 533889791, 'name': 'gtasa-open-downgrader-windows.exe', 'size': 57106018}]}, 'artifacts': [{'id': 9688738676, 'name': 'gtasa-open-downgrader-windows-builds', 'bytes': 992843290}, {'id': 9688700419, 'name': 'gta-sa-downgrader-linux-appimages', 'bytes': 1060228710}]}, {'run': 33093925356, 'head_sha': 'a80697b7d6f669c9bd9cb447a6a10ac9b5723139', 'tag': 'v0.2.1', 'release': {'id': 377976834, 'assets': [{'id': 532585352, 'name': 'gtasa-open-downgrader-linux-offline.AppImage', 'size': 970332664}, {'id': 532585351, 'name': 'gtasa-open-downgrader-linux.AppImage', 'size': 90794488}, {'id': 532585353, 'name': 'gtasa-open-downgrader-windows-offline.exe', 'size': 936652835}, {'id': 532585348, 'name': 'gtasa-open-downgrader-windows.exe', 'size': 57105980}]}, 'artifacts': [{'id': 9655707363, 'name': 'gtasa-open-downgrader-windows-builds', 'bytes': 992842579}, {'id': 9655669481, 'name': 'gta-sa-downgrader-linux-appimages', 'bytes': 1074846619}]}]
          if os.environ["GITHUB_REPOSITORY"] != REPO or os.environ["GITHUB_REF"] != BRANCH:
              raise SystemExit("Unexpected repository or branch; refusing cleanup")

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise RuntimeError("Unexpected API redirect; refusing to send authorization")

          opener = urllib.request.build_opener(NoRedirect)

          def api(path, method="GET", allow_missing=False):
              if not path.startswith("/") or ".." in path or "?" in path:
                  raise ValueError("Unexpected API path")
              req = urllib.request.Request(
                  "https://api.github.com/repos/" + REPO + path,
                  method=method,
                  headers={
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "bounded-actions-artifact-cleanup",
                  },
              )
              try:
                  with opener.open(req, timeout=30) as response:
                      data = response.read()
                      return json.loads(data) if data else None
              except urllib.error.HTTPError as exc:
                  if allow_missing and exc.code == 404:
                      return None
                  raise RuntimeError(f"GitHub API {method} {path}: HTTP {exc.code}") from None

          def verify_release(entry):
              release = api(f"/releases/{entry['release']['id']}")
              if release['draft'] or release['tag_name'] != entry['tag']:
                  raise RuntimeError(f"Release is not published as expected: {entry['tag']}")
              actual = {a['id']: a for a in release['assets']}
              for asset in entry['release']['assets']:
                  candidate = actual.get(asset['id'])
                  if not candidate or any(candidate[k] != asset[k] for k in ('name', 'size')):
                      raise RuntimeError(f"Release asset changed: {entry['tag']} / {asset['name']}")
                  if candidate.get('state') != 'uploaded':
                      raise RuntimeError(f"Release asset is not uploaded: {asset['name']}")

          # Validate the entire fixed allowlist before making any deletion.
          queued = []
          missing = []
          for entry in MANIFEST:
              run = api(f"/actions/runs/{entry['run']}")
              if (run['status'] != 'completed' or run['conclusion'] != 'success'
                      or run['head_sha'] != entry['head_sha'] or run['head_branch'] != entry['tag']):
                  raise RuntimeError(f"Release run changed or is not successful: {entry['run']}")
              verify_release(entry)
              for artifact in entry['artifacts']:
                  current = api(f"/actions/artifacts/{artifact['id']}", allow_missing=True)
                  if current is None:
                      missing.append(artifact['id'])
                      continue
                  if (current['name'] != artifact['name'] or current['size_in_bytes'] != artifact['bytes']
                          or current['workflow_run']['id'] != entry['run']
                          or current['workflow_run']['head_sha'] != entry['head_sha']):
                      raise RuntimeError(f"Artifact changed: {artifact['id']}")
                  queued.append(artifact)

          total_bytes = sum(a['bytes'] for a in queued)
          print(f"Preflight passed: {len(queued)} artifacts, {total_bytes} bytes; {len(missing)} already absent")
          for artifact in queued:
              api(f"/actions/artifacts/{artifact['id']}", method="DELETE", allow_missing=True)
              if api(f"/actions/artifacts/{artifact['id']}", allow_missing=True) is not None:
                  raise RuntimeError(f"Deletion verification failed: {artifact['id']}")
              print(f"Deleted {artifact['id']}: {artifact['name']} ({artifact['bytes']} bytes)")

          # Verify that all published release assets still exist with the same names and sizes.
          for entry in MANIFEST:
              verify_release(entry)

          summary = (f"## Actions artifact cleanup\n\n"
                     f"Deleted {len(queued)} disposable artifacts: {total_bytes:,} bytes "
                     f"({total_bytes / 2**30:.3f} GiB).\n\n"
                     f"Already absent: {len(missing)}. All published release assets verified unchanged.\n"
                     f"Only the ten artifact IDs embedded in this one-time workflow were eligible.\n")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as handle:
              handle.write(summary)
          print(summary)
          PYTHON
